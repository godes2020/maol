name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release (tag v<package.json version>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Moa-windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Runs for a pushed tag, or for a manual run with "publish" ticked.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moa ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/Moa-Setup-*.exe
            dist/Moa-*-portable.exe
            dist/latest.yml
