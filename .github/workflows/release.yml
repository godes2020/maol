name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      # On a tag: build and publish the installer to GitHub Releases.
      - name: Build & publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual run: build only and attach the files to the workflow run.
      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Moa-windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
