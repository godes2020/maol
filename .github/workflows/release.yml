name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release (tag v<package.json version>)'
        type: boolean
        default: false
      native:
        description: 'Build the native (Rust) Moa instead and publish it as a pre-release (tag v<native/Cargo.toml version>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !inputs.native }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build media helper
        run: dotnet publish helper/MoaMedia -c Release -o build/helper

      - name: Smoke-test media helper
        shell: pwsh
        run: |
          $p = Start-Process build/helper/MoaMedia.exe -ArgumentList '--once' -Wait -PassThru -RedirectStandardOutput helper-out.txt
          Get-Content helper-out.txt
          if (-not (Select-String -Path helper-out.txt -Pattern '"type":"hello"')) { throw 'MoaMedia did not start' }
          # Commands over stdin, including the beat analysis (no sound card on CI: it must not crash).
          $psi = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path build/helper/MoaMedia.exe)
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.StandardInput.WriteLine("1`taudio`t1")
          $proc.StandardInput.WriteLine("2`tvolumeBy`t0")
          Start-Sleep -Seconds 3
          $proc.StandardInput.WriteLine("3`taudio`t0")
          Start-Sleep -Seconds 1
          $proc.StandardInput.Close()
          if (-not $proc.WaitForExit(5000)) { $proc.Kill(); throw 'MoaMedia did not exit when stdin closed' }
          $out = $proc.StandardOutput.ReadToEnd()
          $out
          if ($out -notmatch '"id":"1","value":true') { throw 'audio command failed' }
          if ($out -notmatch '"id":"3","value":true') { throw 'helper stopped answering' }

      - name: Build
        run: npx electron-builder --win --x64 --publish never

      - name: Pack browser extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension\* -DestinationPath dist\Moa-Connector-extension.zip
          Copy-Item dist\Moa-Connector-extension.zip dist\Moa-Connector-firefox.xpi

      - uses: actions/upload-artifact@v4
        with:
          name: Moa-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Runs for a pushed tag, or for a manual run with "publish" ticked.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moa ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/Moa-Setup-*.exe
            dist/Moa-*-portable.exe
            dist/Moa-Connector-extension.zip
            dist/Moa-Connector-firefox.xpi
            dist/latest.yml

  native:
    if: ${{ inputs.native }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1 -Exe target/release/moa.exe

      - name: Name the exe
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p dist
          cp target/release/moa.exe "dist/Moa-${version}-preview-x64.exe"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Moa-native-windows
          path: native/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub pre-release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Moa v${{ steps.version.outputs.version }} (native preview)
          body_path: native/release-notes.md
          prerelease: true
          make_latest: false
          files: native/dist/Moa-*-preview-x64.exe
