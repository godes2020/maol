[package]
name = "moa"
version = "0.5.0"
edition = "2021"
description = "Moa — Music Overlay App"
license = "MIT"

[features]
default = ["skia"]
# Skia draws the full look (gradients, glows, rounded images) on the CPU in a
# few megabytes; without it Slint's basic software renderer is used.
skia = ["slint/renderer-skia"]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
global-hotkey = "0.9"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Globalization",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }
windows-future = "0.3"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
